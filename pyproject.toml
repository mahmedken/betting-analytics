[project]
name = "betting-analytics"
version = "0.1.0"
description = "Model-based analytics for football betting and prediction markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "requests>=2.31",
    "threadpoolctl>=3.2",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ba = "betting_analytics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/betting_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
