name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: browser math and Kalshi relay
        run: node --test site/tests/*.test.mjs proxy/*.test.mjs
